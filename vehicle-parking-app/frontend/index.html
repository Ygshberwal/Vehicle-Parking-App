<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- vue specific -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script src="https://unpkg.com/vue-router@3/dist/vue-router.js"></script>
    <script src="https://unpkg.com/vuex@3.0.0"></script>
    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>Vehicle Parking App</title>
    <meta name="description" content="Find parking, manage bookings and explore parking activity with ParkingApp.">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="{{url_for('static', filename='app.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='home.css')}}">
</head>
<body data-demo="{{ 'true' if demo_mode else 'false' }}">
    {% if demo_mode %}
    <details class="demo-banner">
        <summary><strong>Portfolio demo</strong><span class="demo-short-note">· Shared fictional data. Please don’t enter personal information.</span></summary>
        <div class="demo-details">
            <span>Driver: <code>user01@parking.com / user123</code></span>
            <span>Admin: <code>admin@parking.com / admin123</code></span>
            <span>Free hosting can take a minute to wake up. Hosted emails and scheduling are disabled.</span>
        </div>
    </details>
    {% endif %}
    <div id="app" v-cloak></div>
    <script  src="{{url_for('static', filename='app.js')}}" type="module"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>

</body>
</html>
